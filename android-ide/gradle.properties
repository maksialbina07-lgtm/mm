# Настройки JVM для Gradle-демона.
# Встроенный CPython + site-packages (aiogram, aiohttp, pydantic) раскладываются
# в assets перед сборкой — это крупные артефакты, поэтому памяти нужно с запасом.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Использовать только androidx (AndroidX обязателен для compileSdk 34)
android.useAndroidX=true

# Нумерация ресурсов не влияет на сборку, но ускоряет её
android.nonTransitiveRClass=true

# Kotlin: корректная генерация метаданных и оптимизация байткода
kotlin.code.style=official

# Параллельная сборка модулей и кэширование задач
org.gradle.parallel=true
org.gradle.caching=true

# Автоконфигурация JDK (если установлен several JDK через toolchains)
org.gradle.java.installations.auto-download=true
