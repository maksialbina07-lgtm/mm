<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Скачать приложение</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1c2230; --muted: #6b7487;
    --accent: #2f6df6; --border: #e2e6ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1b1f29; --text: #e8ebf2; --muted: #98a1b5;
      --accent: #5b8cff; --border: #2b3140;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  .name { font-weight: 600; word-break: break-all; }
  .meta { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
  .btn {
    display: block; text-align: center; background: var(--accent); color: #fff;
    text-decoration: none; padding: 14px; border-radius: 12px;
    font-weight: 600; font-size: 17px;
  }
  .btn:active { opacity: .85; }
  .note { color: var(--muted); font-size: 14px; }
  ol { padding-left: 20px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Скачать приложение</h1>
  <p class="sub">Android-приложение (APK)</p>

  <div id="list"><p class="note">Загрузка…</p></div>

  <noscript>
    <div class="card">
      <div class="name">app-debug.apk</div>
      <div class="meta">JavaScript выключен — ссылка по умолчанию</div>
      <a class="btn" href="app-debug.apk" download>⬇ Скачать APK</a>
    </div>
  </noscript>

  <h2>Как установить</h2>
  <ol>
    <li>Скачай APK на телефон с Android.</li>
    <li>Открой файл. Если система попросит, разреши установку из этого источника.</li>
    <li>Подтверди установку.</li>
  </ol>
</main>

<script>
  // Репозиторий, где лежат index.html и .apk
  var REPO = "maksialbina07-lgtm/mm";
  // Если GitHub API недоступен, показываем ссылку на файл с таким именем
  var FALLBACK = "app-debug.apk";

  var list = document.getElementById("list");

  function fmtSize(n) {
    if (!n) return "";
    var units = ["Б", "КБ", "МБ", "ГБ"], i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n.toFixed(0) : n.toFixed(1)) + " " + units[i];
  }

  function card(name, size, note) {
    var box = document.createElement("div");
    box.className = "card";

    var title = document.createElement("div");
    title.className = "name";
    title.textContent = name;

    var meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [fmtSize(size), note].filter(Boolean).join(" · ");

    var a = document.createElement("a");
    a.className = "btn";
    a.href = encodeURIComponent(name);
    a.setAttribute("download", name);
    a.textContent = "⬇ Скачать APK";

    box.appendChild(title);
    box.appendChild(meta);
    box.appendChild(a);
    return box;
  }

  function message(text) {
    var p = document.createElement("p");
    p.className = "note";
    p.textContent = text;
    return p;
  }

  fetch("https://api.github.com/repos/" + REPO + "/contents/")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (items) {
      var apks = items.filter(function (f) { return f.type === "file" && /\.apk$/i.test(f.name); });
      list.textContent = "";
      if (!apks.length) {
        list.appendChild(message("APK пока не загружен. Добавь файл .apk в репозиторий — он появится здесь."));
        return;
      }
      apks.forEach(function (f) { list.appendChild(card(f.name, f.size)); });
    })
    .catch(function () {
      list.textContent = "";
      list.appendChild(card(FALLBACK, 0, "ссылка по умолчанию"));
    });
</script>
</body>
</html>
